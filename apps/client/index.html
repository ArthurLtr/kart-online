<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Corrida de kart 3D multiplayer online em tempo real." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kart Online" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Kart Online</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <canvas id="cena" aria-label="Cena 3D do jogo"></canvas>
    <div id="ui">
      <header class="topo">
        <h1 class="marca">
          <span>Kart <b>Online</b></span>
        </h1>
        <nav class="abas" aria-label="Telas">
          <a href="#menu" data-tela-link="menu">Início</a>
          <a href="#garagem" data-tela-link="garagem">Garagem</a>
          <a href="#conta" data-tela-link="conta">Perfil</a>
          <a href="#config" data-tela-link="config">Configurações</a>
        </nav>
        <a class="piloto" id="piloto" href="#conta" aria-label="Perfil do piloto"></a>
      </header>
      <div id="tela-ui"></div>
      <footer class="rodape">
        <p id="status" role="status">Carregando…</p>
        <ul class="dicas" id="dicas" aria-label="Atalhos"></ul>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
